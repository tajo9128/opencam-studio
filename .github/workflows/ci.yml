name: OpenCam Studio CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build project
      run: npm run build

    - name: Run tests
      run: npm test -- --passWithNoTests
      continue-on-error: true

    - name: Security audit
      run: npm audit --audit-level=high || true
