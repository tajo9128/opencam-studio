services:
  opencam-studio:
    build:
      context: .
      dockerfile: server/Dockerfile.allinone
    ports:
      - "3000:80"
    restart: unless-stopped
    volumes:
      - videos:/videos
      - proxies:/proxies
      - projects:/projects
      - output:/output
      - recordings:/recordings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_THREADS=${LLM_THREADS:-4}
      - LLM_CTX_SIZE=${LLM_CTX_SIZE:-2048}
      - LLM_PORT=8084
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  videos:
  proxies:
  projects:
  output:
  recordings:
  models:
